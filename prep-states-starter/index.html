<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prep starter: Compass nav, button and category pills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Hanken+Grotesk:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="bg-paper font-sans leading-relaxed text-ink">
    <!-- Prep starter. A small Compass page with three things that need states: the navigation links (Home is the current page), the Request support button, and the category pills. It looks right at rest and reacts to nothing yet. The lesson adds the states, one target at a time. -->
    <header class="border-b-(length:--rule) border-ink bg-paper">
      <div
        class="mx-auto flex max-w-5xl flex-wrap items-center gap-4 px-5 py-4"
      >
        <a
          href="index.html"
          class="flex items-center font-display text-xl font-black tracking-tight text-ink no-underline"
        >
          <span
            aria-hidden="true"
            class="mr-2 size-3 rounded-full bg-green"
          ></span>
          Compass
        </a>
        <nav aria-label="Primary" class="contents">
          <a
            href="index.html"
            aria-current="page"
            class="py-1 text-base font-bold text-ink no-underline hover:underline hover:decoration-green hover:decoration-[0.15em] hover:underline-offset-[0.2em] aria-[current=page]:underline aria-[current=page]:decoration-ink aria-[current=page]:decoration-[0.15em] aria-[current=page]:underline-offset-[0.2em] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link"
            >Home</a
          >
          <a
            href="find-support-services.html"
            class="py-1 text-base font-bold text-ink no-underline hover:underline hover:decoration-green hover:decoration-[0.15em] hover:underline-offset-[0.2em] aria-[current=page]:underline aria-[current=page]:decoration-ink aria-[current=page]:decoration-[0.15em] aria-[current=page]:underline-offset-[0.2em] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link"
            >Find support services</a
          >
          <a
            href="events.html"
            class="py-1 text-base font-bold text-ink no-underline hover:underline hover:decoration-green hover:decoration-[0.15em] hover:underline-offset-[0.2em] aria-[current=page]:underline aria-[current=page]:decoration-ink aria-[current=page]:decoration-[0.15em] aria-[current=page]:underline-offset-[0.2em] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link" 
            >Events &amp; drop-ins</a
          >
          <a
            href="request-support.html"
            class="ml-auto py-1 font-display text-base font-extrabold text-link no-underline"
            >Request support</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-5 py-12">
      <h1
        class="font-display text-display leading-none font-black tracking-[-0.03em] text-balance"
      >
        Support that works the way you do
      </h1>
      <p class="mt-4 max-w-[66ch] text-pretty">
        Compass is the neurodivergent student support service at Riverside
        University. You do not need a report or a referral to get started.
      </p>
      <p class="mt-6">
        <a
          class="inline-block border-(length:--rule) border-ink bg-transparent px-6 py-2.5 font-display font-extrabold text-ink no-underline cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:border-link hover:bg-ink-deep hover:text-on-dark active:bg-ink focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link"
          href="request-support.html"
          >Request support</a
        >
      </p>

      <form
        aria-labelledby="filter-heading"
        method="get"
        action="#"
        class="mt-16"
      >
        <h2
          id="filter-heading"
          class="font-display text-h2 leading-none font-extrabold"
        >
          Filter services
        </h2>
        <fieldset
          class="mt-6 border-(length:--rule) border-t-4 border-ink border-t-green bg-paper px-4 pt-3 pb-4"
        >
          <legend
            class="rounded-full bg-green px-3 py-1 font-display text-base font-bold text-on-light"
          >
            Category
          </legend>
          <div class="mt-3 flex flex-wrap gap-3">
            <label
              class="flex items-center gap-2 rounded-full border-(length:--rule) border-ink bg-paper px-3 py-1.5 font-normal cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:bg-lime hover:text-on-light has-checked:border-ink-deep has-checked:bg-ink-deep has-checked:text-on-dark"
              ><input type="checkbox" name="category" value="study-skills"class="focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link" />
              Study skills</label
            >
            <label
              class="flex items-center gap-2 rounded-full border-(length:--rule) border-ink bg-paper px-3 py-1.5 font-normal cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:bg-lime hover:text-on-light has-checked:border-ink-deep has-checked:bg-ink-deep has-checked:text-on-dark"
              ><input type="checkbox" name="category" value="assistive-tech"class="focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link" />
              Assistive technology</label
            >
            <label
              class="flex items-center gap-2 rounded-full border-(length:--rule) border-ink bg-paper px-3 py-1.5 font-normal cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:bg-lime hover:text-on-light has-checked:border-ink-deep has-checked:bg-ink-deep has-checked:text-on-dark"
              ><input type="checkbox" name="category" value="wellbeing"class="focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link" />
              Wellbeing</label
            >
            <label
              class="flex items-center gap-2 rounded-full border-(length:--rule) border-ink bg-paper px-3 py-1.5 font-normal cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:bg-lime hover:text-on-light has-checked:border-ink-deep has-checked:bg-ink-deep has-checked:text-on-dark"
              ><input type="checkbox" name="category" value="financial"class="focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link" />
              Financial</label
            >
            <label
              class="flex items-center gap-2 rounded-full border-(length:--rule) border-ink bg-paper px-3 py-1.5 font-normal cursor-pointer transition-colors duration-120 motion-reduce:transition-none hover:bg-lime hover:text-on-light has-checked:border-ink-deep has-checked:bg-ink-deep has-checked:text-on-dark"
              ><input type="checkbox" name="category" value="social" class="focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-link"/> Social
              &amp; peer</label
            >
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
